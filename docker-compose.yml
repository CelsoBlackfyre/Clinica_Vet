services:
  db:
    image: mysql:8.0
    container_name: clinica_vet_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-clinica_vet}
      MYSQL_USER: ${DB_USER:-clinica}
      MYSQL_PASSWORD: ${DB_PASSWORD:-clinica123}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinica_vet_net

  backend:
    image: clinica_vet_backend_dev
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: clinica_vet_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_USER=${DB_USER:-clinica}
      - DB_PASSWORD=${DB_PASSWORD:-clinica123}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-clinica_vet}
      - SERVER_PORT=8080
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://frontend:5173}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ./server:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - clinica_vet_net
    command: ["air"]

  frontend:
    image: clinica_vet_frontend_dev
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: clinica_vet_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:${SERVER_PORT:-8080}
    networks:
      - clinica_vet_net
    depends_on:
      backend:
        condition: service_healthy

  frontend-test:
    image: clinica_vet_frontend_dev
    build:
      context: .
      dockerfile: Dockerfile.frontend
    profiles: ["tools"]
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:${SERVER_PORT:-8080}
    networks:
      - clinica_vet_net
    command: ["npm", "test", "--", "--run"]

  frontend-typecheck:
    image: clinica_vet_frontend_dev
    build:
      context: .
      dockerfile: Dockerfile.frontend
    profiles: ["tools"]
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - clinica_vet_net
    command: ["npm", "run", "typecheck"]

  frontend-build:
    image: clinica_vet_frontend_dev
    build:
      context: .
      dockerfile: Dockerfile.frontend
    profiles: ["tools"]
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - clinica_vet_net
    command: ["npm", "run", "build"]

  backend-test:
    image: clinica_vet_backend_dev
    build:
      context: ./server
      dockerfile: Dockerfile
    profiles: ["tools"]
    volumes:
      - ./server:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    networks:
      - clinica_vet_net
    command: ["go", "test", "./..."]

volumes:
  mysql_data:
  go_mod_cache:
  go_build_cache:

networks:
  clinica_vet_net:
    driver: bridge
